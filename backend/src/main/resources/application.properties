# ======================== SERVER ========================
spring.main.banner-mode=off
server.port=8080
server.tomcat.max-swallow-size=10485760
server.tomcat.max-http-form-post-size=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.sql.init.mode=never

# ======================== DATABASE ========================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:iob_kyc}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:user123}

# ======================== FLYWAY ========================
spring.flyway.enabled=false

# ======================== JPA / HIBERNATE ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.open-in-view=false

# ======================== RESILIENCE ========================
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# ======================== JWT ========================
jwt.secret=${JWT_SECRET:my-secret-key-for-iob-kyc-system-jwt-token-generation-2026}
jwt.expiration=86400000
jwt.refresh-expiration=86400000

# ======================== ENCRYPTION ========================
encryption.secret-key=aes256-secret-key-for-iob-kyc-system!!

# ======================== ACTUATOR ========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# ======================== RATE LIMITING ========================
rate-limit.capacity=5000
rate-limit.tokens=1000

# ======================== FILE UPLOAD ========================
file.upload-dir=./uploads
file.allowed-types=image/jpeg,image/png,application/pdf

# ======================== EMAIL (Resend) ========================
resend.api-key=${RESEND_API_KEY:}
resend.from-email=onboarding@resend.dev

# ======================== EMAIL (Gmail SMTP fallback) ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:manonsakthi10@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ======================== AI/ML FLASK SERVER ========================
ai-server.python-path=${AI_PYTHON_PATH:D:\\Hackathon\\Hackathon\\ai-ml\\venv\\Scripts\\python.exe}
ai-server.script-path=${AI_SCRIPT_PATH:D:\\Hackathon\\Hackathon\\ai-ml\\api_server.py}
ai-server.port=5001

# ======================== LOGGING ========================
logging.level.com.iob.kyc=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.catalina=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{30} - %msg%n
