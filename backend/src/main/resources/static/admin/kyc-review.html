<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Review - IOB Admin</title>
    <link rel="stylesheet" href="../css/style.css?v=5">
    <link rel="stylesheet" href="../css/admin.css?v=5">
</head>
<body class="admin-body">
    <nav class="navbar admin-navbar">
        <div class="logo">
            <img src="../assets/logo.png" alt="IOB" class="iob-logo" height="36">
            <span>Indian Overseas Bank - Admin</span>
        </div>
        <div class="hamburger" onclick="toggleMobileMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-right"><div class="nav-links" id="navLinks">
            <a href="dashboard.html">Dashboard</a>
            <a href="kyc-review.html" class="active">KYC Review</a>
            <a href="#" onclick="handleAdminLogout(); return false;">Logout</a>
        </div> <button class="dark-mode-toggle" onclick="toggleDarkMode()" title="Toggle Dark Mode">&#9790;</button></div>
    
    </nav>

    <div class="admin-container">
        <div class="admin-header fade-in">
            <div>
                <h1>KYC Application Review</h1>
                <p>Review, approve, or reject KYC applications</p>
            </div>
        </div>

        <div class="card fade-in">
            <div class="card-header">
                <h3>&#128221; Pending KYC Applications</h3>
                <span class="badge badge-warning" id="pendingBadge">0</span>
            </div>
            <div id="kycReviewList">
                <p style="text-align:center;padding:40px;color:var(--gray-500)">No pending applications</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="reviewModal">
        <div class="modal">
            <div class="modal-header">
                <h2>KYC Application Details</h2>
                <button class="modal-close" onclick="closeReviewModal()">&times;</button>
            </div>
            <div id="reviewModalContent">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="../js/main.js?v=5"></script>
    <script src="../js/auth.js?v=5"></script>
    <script src="../js/admin.js?v=5"></script>
</body>
</html>
