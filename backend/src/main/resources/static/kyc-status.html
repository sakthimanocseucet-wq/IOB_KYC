<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Status - Indian Overseas Bank</title>
    <link rel="stylesheet" href="../css/style.css?v=12">
    <link rel="stylesheet" href="../css/dashboard.css?v=12">
    <style>
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="../assets/logo.png" alt="IOB" class="iob-logo" height="36">
            <span>Indian Overseas Bank</span>
        </div>
        <div class="hamburger" onclick="toggleMobileMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-right"><div class="nav-links" id="navLinks">
            <a href="dashboard.html">Dashboard</a>
            <a href="kyc-status.html" class="active">KYC Status</a>
            <a href="#" onclick="handleLogout(); return false;">Logout</a>
        </div> <button class="dark-mode-toggle" onclick="toggleDarkMode()" title="Toggle Dark Mode">&#9790;</button></div>
    </nav>

    <div class="dashboard-container">
        <div class="dashboard-header fade-in">
            <h1 id="statusTitle">KYC Application Status</h1>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                <span id="appTypeBadge"></span>
                <p id="appRef" style="color:var(--gray-500);margin:0"></p>
                <span id="liveStatusBadge"></span>
            </div>
        </div>

        <div class="card" style="min-height:200px">
            <div id="statusContent"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="js/swipe.js?v=1"></script>
    <script src="../js/main.js?v=swipe2"></script>
    <script src="../js/auth.js?v=12"></script>
    <script>
    (function() {
        function loadStatus() {
            var container = document.getElementById('statusContent');
            var token = getAuthToken();
            if (!token) {
                container.innerHTML = '<div style="text-align:center;padding:40px"><p>Please <a href="login.html">login</a> to view KYC status.</p></div>';
                return;
            }

            container.innerHTML = '<div style="text-align:center;padding:40px"><div class="spinner" style="margin:0 auto 12px"></div><p style="color:var(--gray-500)">Loading application status...</p></div>';

            fetch('/api/kyc/status', { headers: { 'Authorization': 'Bearer ' + token } })
                .then(function(r) {
                    if (r.status === 401 || r.status === 403) {
                        clearAuthData();
                        window.location.href = 'login.html';
                        return null;
                    }
                    return r.json();
                })
                .then(function(result) {
                    if (!result) return;

                    if (!result.success || !result.data || result.data.length === 0) {
                        container.innerHTML = '<div style="text-align:center;padding:40px">' +
                            '<p style="font-size:48px;margin-bottom:16px">&#128196;</p>' +
                            '<h3>No KYC Application Found</h3>' +
                            '<p style="color:var(--gray-500);margin:12px 0">You haven\'t submitted a KYC application yet.</p>' +
                            '<a href="kyc.html" class="btn btn-primary" style="margin-top:12px">Start KYC Application</a>' +
                            '</div>';
                        document.getElementById('appRef').textContent = '';
                        document.getElementById('liveStatusBadge').textContent = '';
                        return;
                    }

                    var apps = result.data;
                    var dedupedApps = {};
                    for (var di = 0; di < apps.length; di++) {
                        var da = apps[di];
                        var dKey = (da.ocrName || '') + '|' + (da.applicationType || 'NORMAL');
                        if (!dedupedApps[dKey] || da.id > dedupedApps[dKey].id) {
                            dedupedApps[dKey] = da;
                        }
                    }
                    apps = [];
                    for (var dk in dedupedApps) apps.push(dedupedApps[dk]);
                    apps.sort(function(a, b) { return b.id - a.id; });

                    var app = apps[0];
                    var appId = app.id || 1;
                    var appRef = app.applicationRef || ('IOB-KYC-' + String(appId).padStart(5, '0'));
                    var status = (app.status || 'PENDING').toUpperCase();
                    var appType = (app.applicationType || 'NORMAL').toUpperCase();
                    var riskScore = parseInt(app.riskScore) || 0;
                    var faceMatchNum = parseFloat(String(app.faceMatchPercentage || '0')) || 0;
                    var hasDoc = !!(app.aadhaarFrontPath || app.panCardPath || app.docFilePath);
                    var hasSelfie = !!(app.selfieFilePath);
                    var hasPhoto = !!(app.photoFilePath);
                    var ocrName = app.ocrName || 'User';
                    var livenessPassed = !!(app.livenessPassed);
                    var gender = app.gender || '';
                    var mobile = app.mobile || '';
                    var branchId = app.branchId || '';

                    var rekycFaceMatch = faceMatchNum;
                    var rekycLiveness = livenessPassed;
                    var rekycHasDoc = hasDoc;
                    var rekycHasSelfie = hasSelfie;
                    var oldApprovedApp = null;

                    if (appType === 'RE_KYC') {
                        for (var j = 1; j < apps.length; j++) {
                            var prev = apps[j];
                            if (!rekycFaceMatch && prev.faceMatchPercentage) rekycFaceMatch = parseFloat(String(prev.faceMatchPercentage)) || 0;
                            if (!rekycLiveness && prev.livenessPassed) rekycLiveness = true;
                            if (!rekycHasSelfie && prev.selfieFilePath) rekycHasSelfie = true;
                            if (!rekycHasDoc && (prev.aadhaarFrontPath || prev.panCardPath || prev.docFilePath)) rekycHasDoc = true;
                            if (!oldApprovedApp && prev.status === 'APPROVED') oldApprovedApp = prev;
                        }
                        window._compareData = { oldApp: oldApprovedApp, newApp: app };
                    }

                    document.getElementById('appRef').textContent = 'Ref: ' + appRef;
                    if (appType === 'RE_KYC') {
                        document.getElementById('statusTitle').textContent = 'Re-KYC Application Status';
                        document.getElementById('appTypeBadge').innerHTML = '<span style="background:var(--primary,#1a73e8);color:#fff;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600">Re-KYC</span>';
                    } else {
                        document.getElementById('statusTitle').textContent = 'KYC Application Status';
                        document.getElementById('appTypeBadge').innerHTML = '';
                    }

                    var statusBadgeHtml = '';
                    if (status === 'APPROVED') {
                        statusBadgeHtml = '<span class="badge badge-success" style="font-size:14px;padding:6px 16px">&#9989; Approved</span>';
                    } else if (status === 'REJECTED') {
                        statusBadgeHtml = '<span class="badge badge-danger" style="font-size:14px;padding:6px 16px">&#10060; Rejected</span>';
                    } else if (status === 'UNDER_REVIEW') {
                        statusBadgeHtml = '<span class="badge badge-warning" style="font-size:14px;padding:6px 16px">&#128260; Under Review</span>';
                    } else {
                        statusBadgeHtml = '<span class="badge badge-warning" style="font-size:14px;padding:6px 16px">&#9203; Pending</span>';
                    }
                    document.getElementById('liveStatusBadge').innerHTML = statusBadgeHtml;

                    localStorage.setItem('kycSubmitted', 'true');
                    localStorage.setItem('kycAppId', appId);
                    var kycData = JSON.parse(localStorage.getItem('kycData') || '{}');
                    kycData.status = status;
                    kycData.appId = appId;
                    kycData.riskScore = riskScore;
                    kycData.faceMatch = faceMatchNum;
                    kycData.ocrName = ocrName;
                    localStorage.setItem('kycData', JSON.stringify(kycData));

                    var fmtDate = function(d) {
                        if (!d) return '';
                        try { return new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + new Date(d).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }); } catch(e) { return ''; }
                    };

                    var stages = [];
                    if (appType === 'RE_KYC') {
                        var detailsVerified = !!(app.ocrName && app.ocrName !== 'User');
                        var faceVerified = !!(rekycFaceMatch > 0 || rekycLiveness);
                        stages = [
                            { title: 'Previous KYC Verified', desc: oldApprovedApp ? 'Previous KYC (' + (oldApprovedApp.applicationRef || 'IOB-KYC-' + String(oldApprovedApp.id).padStart(5, '0')) + ') confirmed as approved' : 'Your existing approved KYC has been verified', done: true, time: oldApprovedApp && oldApprovedApp.reviewedAt ? fmtDate(oldApprovedApp.reviewedAt) : '' },
                            { title: 'Face Re-Verification', desc: faceVerified ? 'Face re-verified successfully' + (rekycFaceMatch ? ' (Match: ' + rekycFaceMatch.toFixed(1) + '%)' : '') : 'Awaiting face verification', done: faceVerified, time: (rekycFaceMatch > 0 || rekycLiveness) && app.submittedAt ? fmtDate(app.submittedAt) : '' },
                            { title: 'Details Reviewed & Updated', desc: detailsVerified ? 'Personal details reviewed and updated for Re-KYC' : 'Awaiting details review', done: detailsVerified, time: detailsVerified && app.submittedAt ? fmtDate(app.submittedAt) : '' },
                            { title: 'Documents Submitted', desc: rekycHasDoc ? 'Identity documents submitted for Re-KYC' : 'Documents from previous KYC on file', done: true, time: app.submittedAt ? fmtDate(app.submittedAt) : '' },
                            { title: 'Bank Review', desc: status === 'APPROVED' ? 'Re-KYC approved by bank' : status === 'REJECTED' ? 'Re-KYC application was rejected' : 'Awaiting review by bank officer', done: status === 'APPROVED' || status === 'REJECTED', time: app.reviewedAt ? fmtDate(app.reviewedAt) : '' }
                        ];
                    } else {
                        stages = [
                            { title: 'Document Upload', desc: hasDoc ? 'Identity document uploaded successfully' : 'Upload your identity document', done: hasDoc, time: app.createdAt ? fmtDate(app.createdAt) : '' },
                            { title: 'Personal Details & OCR', desc: (app.ocrName && app.ocrName !== 'User') ? 'Details verified: ' + ocrName : 'Verifying personal details', done: !!(app.ocrName && app.ocrName !== 'User'), time: app.submittedAt ? fmtDate(app.submittedAt) : '' },
                            { title: 'Face Verification', desc: (faceMatchNum > 0 || hasSelfie || livenessPassed) ? 'Face matched (' + faceMatchNum.toFixed(1) + '%)' + (livenessPassed ? ' - Liveness OK' : '') : 'Awaiting live selfie verification', done: !!(faceMatchNum > 0 || hasSelfie || livenessPassed), time: (faceMatchNum > 0 || hasSelfie) && app.submittedAt ? fmtDate(app.submittedAt) : '' },
                            { title: 'AI Risk Assessment', desc: riskScore > 0 ? 'Risk score: ' + riskScore + '/100 (' + (riskScore < 30 ? 'Low Risk' : riskScore < 60 ? 'Medium Risk' : 'High Risk') + ')' : 'Risk assessment pending', done: riskScore > 0, time: riskScore > 0 && app.updatedAt ? fmtDate(app.updatedAt) : '' },
                            { title: 'Bank Review', desc: status === 'APPROVED' ? 'KYC verified and approved by bank' : status === 'REJECTED' ? 'KYC application was rejected' : status === 'UNDER_REVIEW' ? 'Application under review by bank officer' : 'Awaiting review by bank officer', done: status === 'APPROVED' || status === 'REJECTED', time: app.reviewedAt ? fmtDate(app.reviewedAt) : '' }
                        ];
                    }

                    var terminalIndex = -1;
                    if (status === 'REJECTED') terminalIndex = stages.length - 1;

                    var renderStages = terminalIndex >= 0 ? stages.slice(0, terminalIndex + 1) : stages.slice();

                    var html = '<div class="kyc-status-timeline">';
                    renderStages.forEach(function(s, i) {
                        var cls = '';
                        if (terminalIndex >= 0) {
                            if (i < terminalIndex) cls = 'completed';
                            else if (i === terminalIndex) cls = 'rejected';
                        } else if (status === 'APPROVED') {
                            cls = 'completed';
                        } else if (s.done) {
                            cls = 'completed';
                        } else {
                            cls = 'active';
                        }

                        var statusBadge = '';
                        if (status === 'APPROVED' && i === stages.length - 1) {
                            statusBadge = ' <span class="badge badge-success">Approved</span>';
                        } else if (status === 'REJECTED' && terminalIndex >= 0 && i === terminalIndex) {
                            statusBadge = ' <span class="badge badge-danger">Rejected</span>';
                        } else if (status === 'UNDER_REVIEW' && i === stages.length - 1) {
                            statusBadge = ' <span class="badge badge-warning">Under Review</span>';
                        }

                        var statusLabel = cls === 'completed' ? 'Completed' : cls === 'rejected' ? 'Rejected' : cls === 'active' ? 'In Progress' : 'Pending';
                        var timeHtml = s.time ? '<br><small style="color:var(--gray-400);font-size:11px">&#128336; ' + s.time + '</small>' : '';

                        html += '<div class="timeline-item ' + cls + '">' +
                            '<div class="timeline-dot"></div>' +
                            '<div class="timeline-content">' +
                            '<h4>' + s.title + statusBadge + '</h4>' +
                            '<p>' + s.desc + '</p>' +
                            '<small>' + statusLabel + '</small>' + timeHtml +
                            '</div></div>';
                    });
                    html += '</div>';

                    if (appType === 'RE_KYC' && oldApprovedApp) {
                        html += '<div style="text-align:center;margin-top:20px">' +
                            '<button class="btn btn-primary" onclick="showCompareModal()" style="padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">' +
                            '&#128269; Compare KYC vs Re-KYC</button></div>';
                    }

                    if (status === 'REJECTED') {
                        var reason = app.reviewNotes || app.review_notes || 'No specific reason provided. Please contact support for more details.';
                        localStorage.setItem('reKycData', JSON.stringify({ name: app.ocrName || '', dob: app.ocrDob || '', idNumber: app.ocrIdNumber || '', panNumber: app.ocrPanNumber || '', address: app.ocrAddress || '', id: app.id }));
                        var rejectTitle = appType === 'RE_KYC' ? 'Re-KYC Application Rejected' : 'Application Rejected';
                        html += '<div class="kyc-rejected-detail" style="background:rgba(220,38,38,0.05);border:2px solid var(--danger,#dc2626);border-radius:12px;padding:24px;margin-top:24px;text-align:center">' +
                            '<div style="font-size:40px;margin-bottom:8px">&#10060;</div>' +
                            '<h3 style="color:var(--danger,#dc2626);margin:0 0 12px">' + rejectTitle + '</h3>' +
                            '<div style="background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;text-align:left;max-width:500px;margin-left:auto;margin-right:auto">' +
                            '<p style="margin:0;color:#333"><strong>Rejection Reason:</strong></p>' +
                            '<p style="margin:8px 0 0;color:#666;font-size:14px">' + reason + '</p></div>' +
                            '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">' +
                            '<a href="rekyc.html" class="btn btn-primary" style="margin-top:8px;display:inline-flex;align-items:center;gap:8px;padding:12px 28px;font-size:16px">&#128260; Re-KYC Application</a>' +
                            '<a href="kyc.html" class="btn btn-outline" style="margin-top:8px;display:inline-flex;align-items:center;gap:8px;padding:12px 28px;font-size:16px">&#128221; New Application</a>' +
                            '</div></div>';
                    }

                    if (apps.length > 1) {
                        html += '<div style="margin-top:32px;border-top:1px solid #e5e7eb;padding-top:24px">';
                        html += '<h3 style="margin:0 0 16px;font-size:18px">Application History</h3>';
                        html += '<div class="kyc-history-list">';
                        apps.forEach(function(h, idx) {
                            var hStatus = (h.status || 'PENDING').toUpperCase();
                            var hBadge = '';
                            if (hStatus === 'APPROVED') hBadge = '<span class="badge badge-success">Approved</span>';
                            else if (hStatus === 'REJECTED') hBadge = '<span class="badge badge-danger">Rejected</span>';
                            else if (hStatus === 'UNDER_REVIEW') hBadge = '<span class="badge badge-warning">Under Review</span>';
                            else hBadge = '<span class="badge badge-warning">Pending</span>';
                            var hType = (h.applicationType || 'NORMAL').toUpperCase();
                            var typeLabel = hType === 'RE_KYC' ? '<span style="background:#1a73e8;color:#fff;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600;margin-left:6px">Re-KYC</span>' : '';
                            var isActive = (idx === 0) ? 'style="border-left:3px solid #1a73e8;background:rgba(0,71,171,0.03)"' : '';
                            var activeLabel = (idx === 0) ? '<span class="badge badge-primary" style="margin-left:8px;font-size:10px">Latest</span>' : '';
                            var hTime = h.submittedAt ? fmtDate(h.submittedAt) : (h.createdAt ? fmtDate(h.createdAt) : 'N/A');
                            html += '<div class="kyc-history-item" ' + isActive + ' style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #f3f4f6;border-radius:8px;margin-bottom:8px;gap:12px;flex-wrap:wrap">' +
                                '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
                                '<span style="font-weight:600;color:#374151">' + (h.applicationRef || 'IOB-KYC-' + String(h.id).padStart(5, '0')) + '</span>' +
                                hBadge + typeLabel + activeLabel + '</div>' +
                                '<small style="color:#6b7280">' + hTime + '</small></div>';
                        });
                        html += '</div></div>';
                    }

                    cachedStatusHtml = html;
                    container.innerHTML = html;
                })
                .catch(function(e) {
                    console.error('[KYC-Status] Error:', e);
                    container.innerHTML = '<div style="text-align:center;padding:40px"><p style="color:var(--danger)">Unable to load status. Please try again.</p></div>';
                });
        }

        var cachedStatusHtml = null;
        window._compareData = null;
        loadStatus();
    })();

    function showCompareModal() {
        var d = window._compareData;
        if (!d || !d.oldApp || !d.newApp) return;
        var o = d.oldApp, n = d.newApp;
        var fields = [
            { label: 'Name', old: o.ocrName, new: n.ocrName },
            { label: 'Date of Birth', old: o.ocrDob, new: n.ocrDob },
            { label: 'ID Number (Aadhaar)', old: o.ocrIdNumber, new: n.ocrIdNumber },
            { label: 'PAN Number', old: o.ocrPanNumber, new: n.ocrPanNumber },
            { label: 'Address', old: o.ocrAddress, new: n.ocrAddress },
            { label: 'Gender', old: o.gender, new: n.gender },
            { label: 'Mobile', old: o.mobile, new: n.mobile },
            { label: 'Email', old: o.email, new: n.email },
            { label: 'Face Match %', old: o.faceMatchPercentage ? parseFloat(String(o.faceMatchPercentage)).toFixed(1) + '%' : 'N/A', new: n.faceMatchPercentage ? parseFloat(String(n.faceMatchPercentage)).toFixed(1) + '%' : 'N/A' },
            { label: 'Liveness', old: o.livenessPassed ? 'Passed' : 'Not Passed', new: n.livenessPassed ? 'Passed' : 'Not Passed' },
            { label: 'Risk Score', old: o.riskScore != null ? o.riskScore + '/100' : 'N/A', new: n.riskScore != null ? n.riskScore + '/100' : 'N/A' }
        ];
        var rows = '';
        fields.forEach(function(f) {
            var changed = (f.old || '') !== (f.new || '');
            var bg = changed ? 'rgba(59,130,246,0.06)' : '';
            var icon = changed ? '<span style="color:var(--primary,#1a73e8);font-weight:700;font-size:11px;margin-left:4px" title="Changed">&#9881;</span>' : '<span style="color:#9ca3af;font-size:11px;margin-left:4px">&#10003;</span>';
            rows += '<tr style="background:' + bg + '">' +
                '<td style="padding:10px 14px;font-weight:600;color:#374151;border-bottom:1px solid #f3f4f6;font-size:13px;white-space:nowrap">' + f.label + icon + '</td>' +
                '<td style="padding:10px 14px;border-bottom:1px solid #f3f4f6;font-size:13px;color:#555">' + (f.old || 'N/A') + '</td>' +
                '<td style="padding:10px 14px;border-bottom:1px solid #f3f4f6;font-size:13px;color:#555">' + (f['new'] || 'N/A') + '</td></tr>';
        });
        var html = '<div id="compareModalOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px" onclick="closeCompareModal(event)">' +
            '<div style="background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)" onclick="event.stopPropagation()">' +
            '<div style="padding:24px 24px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding-bottom:16px">' +
            '<h2 style="margin:0;font-size:20px;color:#1f2937">&#128269; KYC vs Re-KYC Comparison</h2>' +
            '<button onclick="closeCompareModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#9ca3af;padding:4px 8px;border-radius:6px" onmouseover="this.style.background=\'#f3f4f6\'" onmouseout="this.style.background=\'none\'">&times;</button></div>' +
            '<div style="padding:16px 24px 24px">' +
            '<p style="font-size:12px;color:#6b7280;margin:0 0 16px">&#9881; = Changed from original KYC &nbsp;&nbsp; &#10003; = Unchanged</p>' +
            '<table style="width:100%;border-collapse:collapse">' +
            '<thead><tr style="background:#f9fafb">' +
            '<th style="padding:10px 14px;text-align:left;font-size:12px;color:#6b7280;border-bottom:2px solid #e5e7eb;font-weight:600">Field</th>' +
            '<th style="padding:10px 14px;text-align:left;font-size:12px;color:#6b7280;border-bottom:2px solid #e5e7eb;font-weight:600">Original KYC</th>' +
            '<th style="padding:10px 14px;text-align:left;font-size:12px;color:#6b7280;border-bottom:2px solid #e5e7eb;font-weight:600">Re-KYC</th>' +
            '</tr></thead><tbody>' + rows + '</tbody></table>' +
            '</div></div></div>';
        document.body.insertAdjacentHTML('beforeend', html);
    }

    function closeCompareModal(e) {
        if (e && e.target && e.target.id !== 'compareModalOverlay') return;
        var el = document.getElementById('compareModalOverlay');
        if (el) el.remove();
    }
    </script>
</body>
</html>
