<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - IOB KYC</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="../assets/logo.png" alt="IOB" class="iob-logo" height="36">
            <span>Indian Overseas Bank</span>
        </div>
        <div class="hamburger" onclick="toggleMobileMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-right"><div class="nav-links" id="navLinks">
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="active">Register</a>
        </div> <button class="dark-mode-toggle" onclick="toggleDarkMode()" title="Toggle Dark Mode">&#9790;</button></div>
    
    </nav>

    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <img src="../assets/logo-full.png" alt="Indian Overseas Bank" height="50">
                <h2>Create Account</h2>
                <p>Begin your KYC journey with Indian Overseas Bank</p>
            </div>
            <div id="alertContainer"></div>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="John" required oninput="clearFieldError('firstNameError')">
                        <small class="field-error" id="firstNameError" style="color:#dc2626;font-size:12px;margin-top:4px;display:none"></small>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Doe" required oninput="clearFieldError('lastNameError')">
                        <small class="field-error" id="lastNameError" style="color:#dc2626;font-size:12px;margin-top:4px;display:none"></small>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" required oninput="clearFieldError('emailError')">
                    <small class="field-error" id="emailError" style="color:#dc2626;font-size:12px;margin-top:4px;display:none"></small>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="+91 9876543210" pattern="\+[0-9]{1,4}\s?[0-9]{7,12}" required oninput="clearFieldError('phoneError')">
                    <small style="color:var(--gray-500)">Include country code (e.g., +91 for India)</small>
                    <small class="field-error" id="phoneError" style="color:#dc2626;font-size:12px;margin-top:4px;display:none"></small>
                </div>
                <div class="form-group otp-group" id="otpGroup">
                    <label>OTP Verification</label>
                    <div style="display:flex;gap:8px;margin-bottom:8px">
                        <button type="button" class="btn btn-sm btn-primary" id="otpMethodEmail" onclick="setOtpMethod('email')" style="flex:1;border:2px solid #2563eb">Email OTP</button>
                        <button type="button" class="btn btn-sm btn-outline" id="otpMethodSms" onclick="setOtpMethod('sms')" style="flex:1">SMS OTP</button>
                    </div>
                    <div class="otp-row" id="otpEmailRow">
                        <input type="email" id="regOtpEmail" placeholder="Enter email for OTP">
                    </div>
                    <div class="otp-row" id="otpSmsRow" style="display:none">
                        <input type="tel" id="regOtpPhone" placeholder="Enter phone for OTP (e.g., +919876543210)">
                    </div>
                    <div class="otp-row" style="margin-top:8px">
                        <input type="text" id="regOtp" placeholder="6-digit OTP" maxlength="6" pattern="[0-9]{6}" oninput="clearFieldError('otpError')">
                        <button type="button" class="btn btn-sm btn-primary" onclick="sendRegOTP()" id="sendOtpBtn">Send OTP</button>
                    </div>
                    <small class="field-error" id="otpError" style="color:#dc2626;font-size:12px;margin-top:4px;display:none"></small>
                    <small class="otp-timer" id="otpTimer" style="color:var(--gray-500);margin-top:4px;display:block"></small>
                    <p style="color:#dc2626;font-weight:bold;font-size:13px;margin:4px 0 0">If you do not receive the OTP in your inbox, please check your Spam or Junk folder</p>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Min 8 characters" minlength="8" required oninput="renderPasswordStrength('passwordStrength', this.value);clearFieldError('passwordError')">
                    <span class="toggle-password" onclick="togglePassword('password')">&#128065;</span>
                    <div id="passwordStrength"></div>
                    <small class="field-error" id="passwordError" style="color:#dc2626;font-size:12px;margin-top:4px;display:none"></small>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required oninput="clearFieldError('confirmPasswordError')">
                    <span class="toggle-password" onclick="togglePassword('confirmPassword')">&#128065;</span>
                    <small class="field-error" id="confirmPasswordError" style="color:#dc2626;font-size:12px;margin-top:4px;display:none"></small>
                </div>
                <div class="form-group terms-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" required onchange="clearFieldError('termsError')">
                        I agree to the <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a>
                    </label>
                    <small class="field-error" id="termsError" style="color:#dc2626;font-size:12px;margin-top:4px;display:none"></small>
                </div>
                <button type="submit" class="btn btn-primary btn-full glow-btn">
                    <span id="btnText">Create Account</span>
                    <span id="btnSpinner" class="spinner" style="display:none;width:20px;height:20px;border-width:2px;margin:0"></span>
                </button>
            </form>

            <p class="auth-footer-text">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="../js/swipe.js?v=1"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
